{% extends 'base.html' %}

{% block title %}Settings{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card shadow-sm">
            <div class="card-header bg-light fw-bold">⚙️ Application Settings</div>
            <div class="card-body">
                <p class="text-muted">User settings and configuration options will appear here.</p>

                <form>
                    <div class="mb-3">
                        <label class="form-label">Email Notifications</label>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="emailNotif" checked>
                            <label class="form-check-label" for="emailNotif">Enable critical alerts via email</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Data Retention</label>
                        <select class="form-select">
                            <option>30 Days</option>
                            <option>60 Days</option>
                            <option>90 Days</option>
                        </select>
                    </div>
                    <button type="button" class="btn btn-primary">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
