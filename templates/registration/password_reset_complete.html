{% extends "base.html" %}
{% load static %}

{% block title %}Access Restored // AnimalGuard{% endblock %}

{% block content %}
<style>
    :root {
        --neon-blue: #0d6efd;
        --neon-cyan: #00f2ff;
    }

    body {
        background-color: #050505;
        color: white;
        font-family: 'Nunito', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .auth-card {
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(0, 242, 255, 0.3);
        padding: 3rem;
        box-shadow: 0 0 40px rgba(0, 242, 255, 0.1);
        width: 100%;
        max-width: 500px;
        border-radius: 10px;
        text-align: center;
    }

    .btn-cyber {
        background: var(--neon-blue);
        color: white;
        width: 100%;
        padding: 12px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 3px;
        border: none;
        transition: 0.3s;
        margin-top: 2rem;
        cursor: pointer;
        display: block;
        text-decoration: none;
    }

    .success-icon {
        font-size: 4rem;
        color: #198754;
        text-shadow: 0 0 20px #198754;
        margin-bottom: 1rem;
    }
</style>

<div class="container">
    <div class="auth-card">
        <i class="bi bi-shield-lock-fill success-icon"></i>
        <h2 style="font-weight: 900; letter-spacing: 1px;">ACCESS RESTORED</h2>
        <p class="text-muted mt-3">Your password has been successfully updated.</p>
        <p class="text-info small">Secure channel re-established.</p>

        <a href="{% url 'login' %}" class="btn-cyber">LOGIN TO SYSTEM</a>
    </div>
</div>
{% endblock %}
