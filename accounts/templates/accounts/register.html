{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<style>
    /* Gradient Background for Auth Page */
    body {
        background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
        height: 100vh;
        overflow: hidden;
    }

    .card-auth {
        border: none;
        border-radius: 1rem;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
    }

    .form-floating>.form-control:focus~label,
    .form-floating>.form-control:not(:placeholder-shown)~label {
        color: #198754;
        transform: scale(.85) translateY(-0.5rem) translateX(0.15rem);
    }

    /* Hide default help text for cleaner UI */
    .helptext,
    ul.helptext {
        display: none !important;
    }
</style>

<div class="row align-items-center min-vh-100 justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card card-auth">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h3 class="fw-bold">Create Account</h3>
                    <p class="text-muted">Join us to get started</p>
                </div>

                <form method="post" novalidate>
                    {% csrf_token %}

                    {% for field in form %}
                    <div class="form-floating mb-3">
                        {{ field }}
                        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {% for error in field.errors %}
                        <div class="text-danger small mt-1">
                            <i class="bi bi-exclamation-circle me-1"></i>{{ error }}
                        </div>
                        {% endfor %}
                    </div>
                    {% endfor %}

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-success btn-lg rounded-pill fw-bold shadow-sm">
                            Register
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer bg-transparent border-0 text-center py-3">
                <p class="mb-0 text-muted">Already a member? <a href="{% url 'login' %}"
                        class="fw-bold text-decoration-none text-success">Login here</a></p>
            </div>
        </div>
    </div>
</div>

<!-- Ensure form controls have the right class for floating labels -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var inputs = document.querySelectorAll('input, select, textarea');
        inputs.forEach(function (input) {
            input.classList.add('form-control');
            input.placeholder = ' '; // Required for floating labels
        });
    });
</script>
{% endblock %}
